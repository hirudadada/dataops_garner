version: "3.6"

services:
  # For development only
  dev:
    depends_on:
      dev.db:
        condition: service_healthy
      apm:
        condition: service_healthy
    image: ${DEV_IMAGE}
    environment:
      - APP_ENV=development
    env_file:
      - env/cipher.env
      - env/job.env
      - env/database.env
      - env/secret.env
      # - env/databases.env
      # - env/secrets.env
      - env/agent.env
    working_dir: ${APP_HOME}
    volumes:
      - ../../:${APP_HOME}
      - ../../vendor/bundle:/usr/local/bundle
      - ../../../garnet:/gems/garnet
    entrypoint: /bin/sh
    stdin_open: true
    tty: true
