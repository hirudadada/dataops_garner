services:
  # For development only
  app:
    depends_on:
      app.db:
        condition: service_healthy
    image: ${DEV_IMAGE}
    env_file:
      - env/cipher.env
      - env/app.env
      - env/database.env
      - env/secret.env
      - env/apm.env
      - env/jobs/ingestion_job.env
      - env/jobs/simulation_job.env
    working_dir: ${APP_HOME}
    volumes:
      - ../../:${APP_HOME}
      - ./env/jobs:${ENV_HOME}/jobs
      - ./.data/certs:${DEV_ELASTIC_APM_SERVER_CA_CERT}
      - ../../vendor/bundle:/usr/local/bundle
      - ../../../garnet:/gems/garnet
      - ../build/src:${GARNER_HOME}
    entrypoint: /bin/sh
    stdin_open: true
    tty: true
